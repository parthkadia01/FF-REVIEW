<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>અમારો અનુભવ કેવો રહ્યો?</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 380px; margin: 20px auto; }
    h2 { color: #333; margin-bottom: 5px; font-size: 22px; }
    p { color: #666; font-size: 14px; margin-bottom: 15px; }
    .chips-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .btn-chip { background: #e4e6eb; border: none; padding: 10px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: #050505; transition: 0.2s; }
    .btn-chip.selected { background: #1877f2; color: white; }
    .ai-btn { background: #8e44ad; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; width: 100%; }
    #review-box { width: 92%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; resize: none; }
    .main-btn { background: #28a745; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
  </style>
</head>
<body>

<div class="card">
  <h2>અમારો અનુભવ કેવો રહ્યો?</h2>
  <p>તમને શું ગમ્યું તે પસંદ કરો:</p>
  
  <div class="chips-container">
    <button class="btn-chip" onclick="toggleChip(this)">સારી ક્વોલિટી</button>
    <button class="btn-chip" onclick="toggleChip(this)">સરસ કલેક્શન</button>
    <button class="btn-chip" onclick="toggleChip(this)">વ્યાજબી ભાવ</button>
    <button class="btn-chip" onclick="toggleChip(this)">સારુ વર્તન</button>
  </div>

  <button class="ai-btn" onclick="generateReview()">✨ AI રિવ્યુ બનાવો</button>

  <textarea id="review-box" placeholder="અહીં AI રિવ્યુ તૈયાર થશે..."></textarea>

  <button class="main-btn" onclick="copyAndRedirect()">📋 કોપી કરો અને Google પર મૂકો</button>
</div>

<script>
  let selectedKeywords = [];
  
  // 🔴 ૧. અહીં તમારી Gemini API Key નાખો (અંદરના અવતરણ ચિહ્નો રાખીને)
  const GEMINI_API_KEY = "AQ.Ab8RN6J8VO-M6umOQ0M9I5YxTrSabG2ONJdNmoH6vw6bedNHqw" ; 
  
  // 🔴 ૨. અહીં તમારી ગૂગલ રિવ્યુની લિંક નાખો
  const GOOGLE_REVIEW_LINK = "https://g.page/r/CZYN9mksn1LhEBM/review" ;

  function toggleChip(el) {
    el.classList.toggle('selected');
    const val = el.innerText;
    if (selectedKeywords.includes(val)) {
      selectedKeywords = selectedKeywords.filter(k => k !== val);
    } else {
      selectedKeywords.push(val);
    }
  }

  async function generateReview() {
    if(selectedKeywords.length === 0) {
      alert("કૃપા કરીને ઓછામાં ઓછું એક ઓપ્શન પસંદ કરો!");
      return;
    }
    document.getElementById("review-box").value = "AI રિવ્યુ લખી રહ્યું છે...";
    
    const prompt = `Write a short, highly positive 2-sentence Google review in Gujarati for a retail store highlighting these points: ${selectedKeywords.join(", ")}. Do not include quotes or meta text.`;
    
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });
      const data = await response.json();
      const review = data.candidates[0].content.parts[0].text;
      document.getElementById("review-box").value = review.trim();
    } catch(err) {
      document.getElementById("review-box").value = "અહીં ખરીદી કરવાનો અનુભવ ખૂબ જ સરસ રહ્યો! ક્વોલિટી અને સર્વિસ ઉત્તમ છે.";
    }
  }

  function copyAndRedirect() {
    const text = document.getElementById("review-box").value;
    if(!text) {
      alert("પહેલાં AI રિવ્યુ જનરેટ કરો!");
      return;
    }
    navigator.clipboard.writeText(text).then(() => {
      alert("રિવ્યુ કોપી થઈ ગયો છે! હવે Google ઓપન થશે ત્યાં Paste કરીને Post કરી દો.");
      window.location.href = GOOGLE_REVIEW_LINK;
    });
  }
</script>

</body>
</html>
