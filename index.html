<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>અમારો અનુભવ કેવો રહ્યો?</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 380px; margin: 20px auto; }
    h2 { color: #333; font-size: 22px; margin-bottom: 5px; }
    p { color: #666; font-size: 14px; margin-bottom: 15px; }
    .chips-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .btn-chip { background: #e4e6eb; border: none; padding: 10px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; color: #333; transition: 0.2s; }
    .btn-chip.selected { background: #007bff; color: white; }
    .ai-btn { background: #8e44ad; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; width: 100%; font-size: 15px; }
    .ai-btn:disabled { opacity: 0.65; cursor: wait; }
    #review-box { width: 100%; height: 90px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; resize: none; box-sizing: border-box; }
    .main-btn { background: #28a745; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
    .main-btn:disabled { opacity: 0.65; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <h2>અમારો અનુભવ કેવો રહ્યો?</h2>
  <p>તમને શું ગમ્યું તે પસંદ કરો:</p>

  <div class="chips-container">
    <button class="btn-chip" type="button" onclick="toggleChip(this)">સારી ક્વોલિટી</button>
    <button class="btn-chip" type="button" onclick="toggleChip(this)">સરસ કલેક્શન</button>
    <button class="btn-chip" type="button" onclick="toggleChip(this)">વ્યાજબી ભાવ</button>
    <button class="btn-chip" type="button" onclick="toggleChip(this)">સારું વર્તન</button>
  </div>

  <button id="ai-btn" class="ai-btn" type="button" onclick="generateReview()">✨ AI રિવ્યુ બનાવો</button>

  <textarea id="review-box" placeholder="અહીં AI રિવ્યુ તૈયાર થશે..." aria-label="AI review"></textarea>

  <button id="copy-btn" class="main-btn" type="button" onclick="copyAndRedirect()">📋 કોપી કરો અને Google પર મૂકો</button>
</div>

<script>
  let selectedKeywords = [];

  // Secure Vercel backend. The Gemini API key is never exposed in this public file.
  const REVIEW_API_URL = "https://ff-review.vercel.app/api/generate-review";

  const GOOGLE_REVIEW_LINK = "https://g.page/r/CZYN9mksn1LhEBM/review";

  function toggleChip(el) {
    el.classList.toggle('selected');
    const val = el.innerText.trim();

    if (selectedKeywords.includes(val)) {
      selectedKeywords = selectedKeywords.filter(k => k !== val);
    } else {
      selectedKeywords.push(val);
    }
  }

  async function generateReview() {
    if (selectedKeywords.length === 0) {
      alert("કૃપા કરીને ઓછામાં ઓછું એક ઓપ્શન પસંદ કરો!");
      return;
    }

    const reviewBox = document.getElementById("review-box");
    const aiBtn = document.getElementById("ai-btn");
    const copyBtn = document.getElementById("copy-btn");

    reviewBox.value = "AI રિવ્યુ લખી રહ્યું છે, કૃપા કરીને રાહ જુઓ...";
    aiBtn.disabled = true;
    copyBtn.disabled = true;

    try {
      const response = await fetch(REVIEW_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ keywords: selectedKeywords })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || `Server error (${response.status})`);
      }

      if (!data.review || typeof data.review !== "string") {
        throw new Error("Gemini તરફથી valid review મળ્યો નથી.");
      }

      reviewBox.value = data.review.trim();
      copyBtn.disabled = false;
    } catch (err) {
      reviewBox.value = "";
      alert("રિવ્યુ જનરેટ થઈ શક્યો નથી: " + err.message);
    } finally {
      aiBtn.disabled = false;
      copyBtn.disabled = false;
    }
  }

  async function copyAndRedirect() {
    const text = document.getElementById("review-box").value.trim();

    if (!text || text.includes("લખી રહ્યું છે")) {
      alert("પહેલાં AI રિવ્યુ જનરેટ કરો!");
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
      alert("રિવ્યુ કોપી થઈ ગયો છે! હવે Google ખુલશે. ત્યાં Paste કરીને Post કરો.");
      window.location.href = GOOGLE_REVIEW_LINK;
    } catch (err) {
      alert("કોપી થઈ શક્યું નથી. કૃપા કરીને Review text manually copy કરો અને ફરી પ્રયાસ કરો.");
    }
  }
</script>

</body>
</html>
