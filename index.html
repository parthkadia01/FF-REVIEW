<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08294a">
  <link rel="icon" type="image/png" sizes="32x32" href="./FASHION%20FACTORY%20LOGO.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="./FASHION%20FACTORY%20LOGO.png?v=3">
  <link rel="shortcut icon" href="./FASHION%20FACTORY%20LOGO.png?v=3">
  <link rel="apple-touch-icon" href="./FASHION%20FACTORY%20LOGO.png?v=3">
  <title>Fashion Factory | તમારો અનુભવ કેવો રહ્યો?</title>
  <style>
    :root{--navy:#08294a;--navy-2:#061d35;--gold:#c48600;--gold-light:#e0a52b;--cream:#fffaf0;--text:#17324d;--muted:#6f7880}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Gujarati",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(196,134,0,.18),transparent 28%),radial-gradient(circle at 90% 92%,rgba(196,134,0,.14),transparent 28%),linear-gradient(145deg,var(--navy-2),var(--navy));display:flex;justify-content:center;align-items:center;padding:22px 14px;overflow-x:hidden}
    body:before,body:after{content:"";position:fixed;width:180px;height:180px;border:1px solid rgba(224,165,43,.18);border-radius:50%;pointer-events:none}.body:before{top:-95px;left:-80px}.body:after{right:-90px;bottom:-90px}
    .page{width:100%;max-width:470px;position:relative;z-index:1}.brand-card{background:rgba(255,255,255,.98);border:1px solid rgba(224,165,43,.55);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.34)}
    .brand-header{background:linear-gradient(135deg,#fff,#fbf5e8);padding:20px 22px 14px;text-align:center;border-bottom:1px solid rgba(196,134,0,.25)}
    .logo{display:block;width:min(100%,330px);height:auto;max-height:145px;object-fit:contain;margin:0 auto 8px}.gold-line{width:72px;height:3px;margin:4px auto 8px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.tagline{margin:0;color:#40566c;font-size:12px;letter-spacing:.8px;font-weight:600}
    .content{padding:22px 20px 24px;text-align:center}h1{margin:0;color:var(--navy);font-size:24px;line-height:1.35;font-weight:800}.subtitle{margin:7px 0 19px;color:var(--muted);font-size:14px}.chips-container{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-bottom:18px}
    .btn-chip{border:1px solid #d7dce1;background:#f7f8f9;color:var(--navy);padding:10px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}.btn-chip:hover{transform:translateY(-1px)}.btn-chip.selected{background:linear-gradient(135deg,var(--gold-light),var(--gold));border-color:var(--gold);color:#fff;box-shadow:0 5px 15px rgba(196,134,0,.25)}
    .ai-btn,.main-btn,.instagram-btn{width:100%;border:0;border-radius:12px;font-weight:800;cursor:pointer;transition:.15s}.ai-btn:hover:not(:disabled),.main-btn:hover:not(:disabled),.instagram-btn:hover{transform:translateY(-1px)}.ai-btn{background:linear-gradient(135deg,#0c3b67,#08294a);color:#fff;padding:14px;font-size:16px;box-shadow:0 8px 20px rgba(8,41,74,.22);margin-bottom:13px}.main-btn{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;padding:14px;font-size:15px;margin-top:12px;box-shadow:0 8px 20px rgba(196,134,0,.24)}.instagram-btn{display:block;text-decoration:none;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;padding:14px;font-size:15px;margin-top:12px;box-shadow:0 8px 20px rgba(131,58,180,.22)}.ai-btn:disabled,.main-btn:disabled{opacity:.72;cursor:wait;transform:none}
    .spinner{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;margin-right:7px;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    #review-box{width:100%;min-height:112px;padding:14px;border:1px solid #d9d1bd;border-radius:13px;background:var(--cream);color:#263b4f;font-size:15px;line-height:1.65;resize:vertical;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}#review-box:focus{border-color:var(--gold-light);box-shadow:0 0 0 3px rgba(196,134,0,.12)}.hint{margin:9px 0 0;color:#8a8f94;font-size:11px;line-height:1.5}.footer{text-align:center;color:rgba(255,255,255,.72);font-size:11px;margin-top:14px;letter-spacing:.4px}
    @media(max-width:420px){body{padding:12px;align-items:flex-start}.brand-card{margin-top:8px;border-radius:22px}.brand-header{padding:16px 16px 11px}.logo{max-height:120px}.content{padding:19px 15px 20px}h1{font-size:21px}.btn-chip{padding:9px 12px}}
  </style>
</head>
<body>
<main class="page"><section class="brand-card"><header class="brand-header"><img class="logo" alt="FASHION FACTORY" src="FASHION%20FACTORY%20LOGO.png"><div class="gold-line"></div><p class="tagline">FASHION AS UNIQUE AS YOU ARE</p></header><div class="content"><h1>તમારો અનુભવ કેવો રહ્યો?</h1><p class="subtitle">તમને શું ગમ્યું તે પસંદ કરો</p><div class="chips-container"><button class="btn-chip" type="button" onclick="toggleChip(this)">સારી ક્વોલિટી</button><button class="btn-chip" type="button" onclick="toggleChip(this)">સરસ કલેક્શન</button><button class="btn-chip" type="button" onclick="toggleChip(this)">વ્યાજબી ભાવ</button><button class="btn-chip" type="button" onclick="toggleChip(this)">સારું વર્તન</button></div><button id="ai-btn" class="ai-btn" type="button" onclick="generateReview()">✨ AI રિવ્યુ બનાવો</button><textarea id="review-box" placeholder="તમારા અનુભવ પરથી અહીં રિવ્યુ તૈયાર થશે..." aria-label="AI review"></textarea><p id="review-hint" class="hint">રિવ્યુ પસંદ ન આવે તો ફરીથી <b>✨ AI રિવ્યુ બનાવો</b> દબાવો — દર વખતે નવો અને અલગ review મળશે.</p><button id="copy-btn" class="main-btn" type="button" onclick="copyAndRedirect()">📋 કોપી કરો અને Google પર મૂકો</button><a class="instagram-btn" href="https://insta.openinapp.co/dztxm" target="_blank" rel="noopener noreferrer">📸 Instagram પર Follow કરો</a></div></section><div class="footer">FASHION FACTORY • MODASA</div></main>
<script>
let selectedKeywords=[];const REVIEW_API_URL="https://ff-review.vercel.app/api/generate-review";const GOOGLE_REVIEW_LINK="https://g.page/r/CZYN9mksn1LhEBM/review";const RECENT_KEY="ff_review_recent_v2";
function toggleChip(el){el.classList.toggle('selected');const val=el.innerText.trim();if(selectedKeywords.includes(val))selectedKeywords=selectedKeywords.filter(k=>k!==val);else selectedKeywords.push(val)}
function getRecentReviews(){try{const saved=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");return Array.isArray(saved)?saved.slice(0,10):[]}catch(_){return[]}}
function saveRecentReview(review){try{const current=getRecentReviews().filter(item=>item!==review);current.unshift(review);localStorage.setItem(RECENT_KEY,JSON.stringify(current.slice(0,10)))}catch(_){} }
async function generateReview(){if(!selectedKeywords.length){alert("કૃપા કરીને ઓછામાં ઓછું એક ઓપ્શન પસંદ કરો!");return}const reviewBox=document.getElementById("review-box"),aiBtn=document.getElementById("ai-btn"),copyBtn=document.getElementById("copy-btn"),hint=document.getElementById("review-hint");aiBtn.disabled=true;copyBtn.disabled=true;aiBtn.innerHTML='<span class="spinner"></span>રિવ્યુ બની રહ્યો છે...';reviewBox.value="તમારા માટે નવો અને natural AI રિવ્યુ તૈયાર થઈ રહ્યો છે...";hint.textContent="થોડું રાહ જુઓ... રિવ્યુ તૈયાર થયા પછી તમે પસંદ ન આવે તો ફરીથી AI રિવ્યુ બનાવી શકો છો.";try{const response=await fetch(REVIEW_API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({keywords:selectedKeywords,recentReviews:getRecentReviews()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Server error (${response.status})`);if(!data.review||typeof data.review!=="string")throw new Error("Gemini તરફથી valid review મળ્યો નથી.");reviewBox.value=data.review.trim();saveRecentReview(reviewBox.value);copyBtn.disabled=false;hint.innerHTML="રિવ્યુ ગમ્યો નથી? <b>✨ AI રિવ્યુ બનાવો</b> ફરી દબાવો — દર વખતે નવો અને અલગ review મળશે."}catch(err){reviewBox.value="";hint.innerHTML="રિવ્યુ જનરેટ કરવામાં સમસ્યા આવી. ફરીથી <b>✨ AI રિવ્યુ બનાવો</b> દબાવો.";alert("રિવ્યુ જનરેટ થઈ શક્યો નથી: "+err.message)}finally{aiBtn.disabled=false;aiBtn.innerHTML="✨ ફરીથી નવો AI રિવ્યુ બનાવો";copyBtn.disabled=!reviewBox.value.trim()}}
async function copyAndRedirect(){const text=document.getElementById("review-box").value.trim();if(!text||text.includes("AI રિવ્યુ તૈયાર")||text.includes("natural AI રિવ્યુ તૈયાર")){alert("પહેલાં AI રિવ્યુ જનરેટ કરો!");return}try{await navigator.clipboard.writeText(text);alert("રિવ્યુ કોપી થઈ ગયો છે! હવે Google ખુલશે. ત્યાં Paste કરીને Post કરો.");window.location.href=GOOGLE_REVIEW_LINK}catch(err){alert("કોપી થઈ શક્યું નથી. કૃપા કરીને Review text manually copy કરો અને ફરી પ્રયાસ કરો.")}}
</script>
</body></html>
